<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request received | Meridian Support Desk</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f7f5;
      color: #24352f;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 540px);
      padding: 36px;
      border: 1px solid #dce7e1;
      border-radius: 16px;
      background: white;
      box-shadow: 0 8px 28px #20312c14;
      text-align: center;
    }

    .check {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #e5f5eb;
      color: #286b3b;
      font-size: 30px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .message {
      color: #61716b;
      line-height: 1.6;
    }

    .ticket-number {
      margin: 24px 0;
      padding: 16px;
      border-radius: 10px;
      background: #edf5f1;
      color: #147d66;
      font-size: 22px;
      font-weight: bold;
    }

    a {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 18px;
      border-radius: 8px;
      background: #147d66;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      background: #0f6653;
    }
  </style>
</head>

<body>
  <main>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Thank you for contacting support</h1>

    <p class="message">
      We’ve received your request. Our support team will review it and reach out to you soon.
    </p>

    <p class="ticket-number">Your ticket number: #{{ ticket_id }}</p>

    <p class="message">Keep this number for your records.</p>
   <a href="{{ url_for('my_tickets') }}">View my support tickets</a>
  </main>
</body>
</html>
